<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oxy Neuro AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#050814;
color:white;
display:flex;
height:100vh;
overflow:hidden;
}

.sidebar{
width:260px;
background:#0b1120;
padding:20px;
border-right:1px solid #1f2937;
}

.logo{
font-size:24px;
font-weight:700;
margin-bottom:25px;
color:#00e5ff;
}

.new-chat{
background:#00e5ff;
color:#000;
padding:12px;
border-radius:10px;
text-align:center;
cursor:pointer;
font-weight:600;
margin-bottom:20px;
}

.history{
color:#aaa;
line-height:40px;
}

.main{
flex:1;
display:flex;
flex-direction:column;
}

.header{
height:65px;
display:flex;
align-items:center;
padding:0 25px;
border-bottom:1px solid #1f2937;
font-size:22px;
font-weight:600;
}

.chat{
flex:1;
padding:30px;
overflow-y:auto;
}

.bot{
background:#0b1120;
padding:15px;
border-radius:15px;
margin-bottom:15px;
max-width:700px;
}

.user{
background:#00bcd4;
color:black;
padding:15px;
border-radius:15px;
margin-left:auto;
margin-bottom:15px;
max-width:700px;
}

.input-area{
display:flex;
padding:20px;
gap:10px;
border-top:1px solid #1f2937;
}

input{
flex:1;
padding:15px;
border:none;
outline:none;
border-radius:12px;
background:#111827;
color:white;
font-size:16px;
}

button{
padding:15px 25px;
background:#00e5ff;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:600;
}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">🧠 Oxy Neuro</div>

<div class="new-chat" onclick="location.reload()">
+ New Chat
</div>

<div class="history">
Recent Chats
<br>
AI Basics
<br>
Python Help
<br>
Machine Learning
</div>
</div>

<div class="main">

<div class="header">
Oxy Neuro AI Assistant
</div>

<div class="chat" id="chat">

<div class="bot">
👋 Hello! I'm Oxy Neuro AI.
How can I help you today?
</div>

</div>

<div class="input-area">

<input
id="message"
placeholder="Ask anything..."
>

<button onclick="sendMessage()">
Send
</button>

</div>

</div>

<script>

function sendMessage(){

let input=document.getElementById("message");

let text=input.value.trim();

if(text==="") return;

let chat=document.getElementById("chat");

chat.innerHTML+=`
<div class="user">${text}</div>
`;

setTimeout(()=>{

chat.innerHTML+=`
<div class="bot">
I'm still a demo interface.
Later I'll be connected to a real AI model.
</div>
`;

chat.scrollTop=chat.scrollHeight;

},500);

input.value="";

chat.scrollTop=chat.scrollHeight;

}

</script>

</body>
</html>
