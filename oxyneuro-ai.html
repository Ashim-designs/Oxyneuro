<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OxyNeuro AI Assistant</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/oxyneuro-ai.css">
</head>

<body>

<div class="background"></div>

<!-- Header -->
<header class="header">

<div class="left">

<button id="menuBtn" class="icon-btn">
☰
</button>

<h2>🧠 OxyNeuro AI</h2>

</div>

<div class="right">

<button class="icon-btn">🔔</button>

<button class="icon-btn">⚙️</button>

<button class="profile">
👤
</button>

</div>

</header>

<!-- Main Layout -->

<div class="container">

<!-- Sidebar -->

<aside id="sidebar" class="sidebar">

<button class="new-chat">
＋ New Chat
</button>

<nav>

<a href="#">
🏠 Home
</a>

<a href="#">
💬 Chat History
</a>

<a href="#">
🤖 AI Tools
</a>

<a href="#">
🎓 Learning Mode
</a>

<a href="#">
💻 Coding Mode
</a>

<a href="#">
📄 Saved Chats
</a>

<a href="#">
⚙️ Settings
</a>

</nav>

<div class="sidebar-footer">

<p>OxyNeuro AI v1.0</p>

</div>

</aside>

<!-- Chat Section -->

<main class="chat-container">

<div id="chatArea" class="chat-area">

<div class="welcome">

<h1>🧠 Welcome to OxyNeuro AI</h1>

<p>
Ask anything.<br>
Learn faster.<br>
Build smarter.
</p>

<div class="quick-buttons">

<button>Explain AI</button>

<button>Write Code</button>

<button>Summarize PDF</button>

<button>Generate Ideas</button>

</div>

</div>
<!-- Chat Messages -->

<div id="messages" class="messages">

<div class="message ai">
<div class="avatar">🧠</div>

<div class="bubble">
Hello! I'm <strong>OxyNeuro AI</strong> 👋<br><br>
How can I help you today?
</div>
</div>

</div>

</div>

<!-- Chat Input -->

<div class="chat-input">

<button class="tool-btn" title="Attach File">
📎
</button>

<button class="tool-btn" title="Voice">
🎤
</button>

<input
type="text"
id="messageInput"
placeholder="Type your message..."
autocomplete="off">

<button id="sendBtn" class="send-btn">
➤
</button>

</div>

</main>

  <!-- Right AI Panel -->

<aside id="aiPanel" class="ai-panel">

<h3>🤖 AI Models</h3>

<button class="model active">🧠 OxyNeuro AI</button>
<button class="model">💬 ChatGPT</button>
<button class="model">✨ Gemini</button>
<button class="model">🧠 Claude</button>
<button class="model">🔍 Perplexity</button>
<button class="model">⚡ Grok</button>
<button class="model">🚀 DeepSeek</button>

<hr>

<h3>⚡ Quick Tools</h3>

<button class="tool">🎨 Image Generator</button>
<button class="tool">📄 PDF Summarizer</button>
<button class="tool">💻 Code Assistant</button>
<button class="tool">🌐 Web Search</button>

</aside>

</div>

<script src="js/oxyneuro-ai.js"></script>

</body>
</html>
